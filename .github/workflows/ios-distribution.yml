name: Signed iOS IPA
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and attach the IPA to
        required: true
        default: v0.1.1
      export_method:
        description: Must match the supplied Apple distribution profile
        type: choice
        options: [app-store-connect, release-testing, enterprise]
        default: app-store-connect
permissions:
  contents: write
jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - name: Check required owner-provided credentials and release
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          python3 - <<'PY'
          import os
          for key in ('IOS_DISTRIBUTION_P12_BASE64','IOS_P12_PASSWORD','IOS_PROFILE_BASE64','APPLE_TEAM_ID'):
              if not os.environ.get(key):
                  raise SystemExit('Missing owner-provided Apple signing secret: ' + key)
          PY
          gh release view "$RELEASE_TAG" > /dev/null
      - run: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix mobile
      - run: npx cap sync ios
        working-directory: mobile
      - name: Archive, sign and export actual IPA
        env:
          IOS_DISTRIBUTION_P12_BASE64: ${{ secrets.IOS_DISTRIBUTION_P12_BASE64 }}
          IOS_P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          IOS_PROFILE_BASE64: ${{ secrets.IOS_PROFILE_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          KEYCHAIN_PATH="$RUNNER_TEMP/neuromap-signing.keychain-db"
          KEYCHAIN_PASSWORD=$(openssl rand -hex 32)
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          export KEYCHAIN_PATH
          python3 - <<'PY'
          import base64,os
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          for secret,filename in [('IOS_DISTRIBUTION_P12_BASE64','distribution.p12'),('IOS_PROFILE_BASE64','profile.mobileprovision')]:
              p=root/filename
              p.write_bytes(base64.b64decode(os.environ[secret],validate=True))
              p.chmod(0o600)
          PY
          trap 'security delete-keychain "$KEYCHAIN_PATH" || true; rm -f "$RUNNER_TEMP/distribution.p12" "$RUNNER_TEMP/profile.mobileprovision"' EXIT
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$IOS_P12_PASSWORD" -k "$KEYCHAIN_PATH" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          python3 - <<'PY'
          import os,plistlib,shutil
          from pathlib import Path
          root=Path(os.environ['RUNNER_TEMP'])
          profile=plistlib.loads((root/'profile.plist').read_bytes())
          team=os.environ['APPLE_TEAM_ID']
          if team not in profile['TeamIdentifier']:
              raise SystemExit('Provisioning profile does not match Apple team')
          if profile['Entitlements'].get('application-identifier') != team+'.org.neuromap.research':
              raise SystemExit('Profile must explicitly match org.neuromap.research')
          destination=Path.home()/'Library/MobileDevice/Provisioning Profiles'
          destination.mkdir(parents=True,exist_ok=True)
          shutil.copyfile(root/'profile.mobileprovision',destination/(profile['UUID']+'.mobileprovision'))
          (root/'profile-uuid.txt').write_text(profile['UUID'])
          options={'method':os.environ['EXPORT_METHOD'],'teamID':team,'signingStyle':'manual','provisioningProfiles':{'org.neuromap.research':profile['UUID']}}
          (root/'ExportOptions.plist').write_bytes(plistlib.dumps(options))
          PY
          PROFILE_UUID=$(cat "$RUNNER_TEMP/profile-uuid.txt")
          xcodebuild -project mobile/ios/App/App.xcodeproj -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/NeuroMap.xcarchive" DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY='Apple Distribution' PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" archive
          codesign --verify --deep --strict "$RUNNER_TEMP/NeuroMap.xcarchive/Products/Applications/App.app"
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/NeuroMap.xcarchive" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/ipa-export"
          mkdir -p releases/artifacts
          python3 - <<'PY'
          import hashlib,json,os,shutil,subprocess,zipfile
          from pathlib import Path
          files=list((Path(os.environ['RUNNER_TEMP'])/'ipa-export').glob('*.ipa'))
          if len(files)!=1:
              raise SystemExit('Expected exactly one real exported IPA')
          output=Path('releases/artifacts/NeuroMap-AI-iOS.ipa')
          shutil.copyfile(files[0],output)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert any(n.startswith('Payload/') and n.endswith('.app/Info.plist') for n in z.namelist())
          digest=hashlib.sha256(output.read_bytes()).hexdigest()
          (output.parent/'SHA256SUMS-ios.txt').write_text(digest+'  '+output.name+'\n')
          (output.parent/'ios-build-manifest.json').write_text(json.dumps({'source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'name':output.name,'bytes':output.stat().st_size,'sha256':digest,'distribution_method':os.environ['EXPORT_METHOD']},indent=2))
          PY
      - name: Attach only the successfully exported signed IPA
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: gh release upload "$RELEASE_TAG" releases/artifacts/NeuroMap-AI-iOS.ipa releases/artifacts/SHA256SUMS-ios.txt releases/artifacts/ios-build-manifest.json
