name: Signed Android APK
on:
  workflow_dispatch:
  workflow_call:
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_STORE_PASSWORD:
        required: true
      ANDROID_KEY_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Android SDK target
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - run: npm ci --prefix frontend && npm run build --prefix frontend && npm ci --prefix mobile
      - run: npx cap sync android
        working-directory: mobile
      - run: chmod +x gradlew && ./gradlew --no-daemon assembleRelease lintRelease
        working-directory: mobile/android
      - name: Sign and verify release APK
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          python - <<'PY'
          import base64, os
          from pathlib import Path
          for name in ('ANDROID_KEYSTORE_BASE64', 'ANDROID_STORE_PASSWORD', 'ANDROID_KEY_PASSWORD'):
              if not os.environ.get(name):
                  raise SystemExit('Missing required Android signing secret: ' + name)
          key = Path(os.environ['RUNNER_TEMP']) / 'neuromap-release.p12'
          key.write_bytes(base64.b64decode(os.environ['ANDROID_KEYSTORE_BASE64'], validate=True))
          key.chmod(0o600)
          PY
          trap 'rm -f "$RUNNER_TEMP/neuromap-release.p12" "$RUNNER_TEMP/aligned.apk"' EXIT
          mkdir -p releases/artifacts
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/zipalign" -f -p 4 mobile/android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" sign --ks "$RUNNER_TEMP/neuromap-release.p12" --ks-key-alias neuromap-release --ks-pass env:ANDROID_STORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD --out releases/artifacts/NeuroMap-AI-Android-universal.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOLS/apksigner" verify --verbose --print-certs releases/artifacts/NeuroMap-AI-Android-universal.apk > releases/artifacts/Android-signature.txt
          "$TOOLS/aapt" dump badging releases/artifacts/NeuroMap-AI-Android-universal.apk > "$RUNNER_TEMP/apk-metadata.txt"
          ! grep -q application-debuggable "$RUNNER_TEMP/apk-metadata.txt"
          grep "package: name='org.neuromap.research'" "$RUNNER_TEMP/apk-metadata.txt"
          python - <<'PY'
          import zipfile
          with zipfile.ZipFile('releases/artifacts/NeuroMap-AI-Android-universal.apk') as z:
              assert {'AndroidManifest.xml', 'classes.dex', 'assets/public/index.html'} <= set(z.namelist())
              assert not any(n.endswith(('.p12', '.jks', '.keystore')) for n in z.namelist())
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-android
          path: releases/artifacts/*
          if-no-files-found: error
