server {
  listen 8080;
  server_name _;
  client_max_body_size 17m;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
  location /api/ { proxy_pass http://api:8000; proxy_read_timeout 60s; }
  location / { root /usr/share/nginx/html; try_files $uri /index.html; }
}
