name: Security
on:
  push:
  pull_request:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dependencies-and-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
      - run: python -m pip install --upgrade pip==26.2.2 && pip install -r backend/requirements-lock.txt && python -m pip_audit
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: frontend
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: mobile
      - run: npm ci && npm audit --audit-level=moderate
        working-directory: desktop
      - name: Scan repository history for secrets
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.2 detect --source /repo --no-banner --redact
