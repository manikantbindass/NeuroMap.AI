name: CI
on:
  push:
    branches: [main, feat/neuromap-ai-foundation]
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: pip install -r backend/requirements-lock.txt
      - run: python -m ruff check . && python -m ruff format --check .
      - run: python -m pytest -q
      - run: npm ci && npm run format:check && npm run lint && npm test && npm run build
        working-directory: frontend
      - name: Full browser workflow and accessibility smoke
        shell: bash
        run: |
          export NEUROMAP_PASSWORD="$(openssl rand -hex 24)"
          mkdir -p data
          python -m alembic upgrade head
          python -m uvicorn backend.app.main:create_app --factory --host 127.0.0.1 --port 8000 --no-access-log > data/api.log 2>&1 &
          API_PID=$!
          cd frontend
          npx playwright install --with-deps chromium
          npm run dev > ../data/frontend.log 2>&1 &
          WEB_PID=$!
          trap 'kill "$API_PID" "$WEB_PID"' EXIT
          for i in {1..30}; do curl -fsS http://127.0.0.1:5173 > /dev/null && curl -fsS http://127.0.0.1:8000/api/ready > /dev/null && break; sleep 1; done
          npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: browser-evidence
          path: assets/screenshots/*.png
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and smoke Docker topology
        shell: bash
        run: |
          export NEUROMAP_PASSWORD="$(openssl rand -hex 24)"
          docker compose up -d --build
          trap 'docker compose down -v' EXIT
          for i in {1..60}; do curl -fsS http://127.0.0.1:8080/api/ready && break; sleep 2; done
          curl -fsS http://127.0.0.1:8080/api/ready
          curl -fsS http://127.0.0.1:8080/ > /dev/null
