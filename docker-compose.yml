services:
  api:
    build: .
    environment:
      NEUROMAP_PASSWORD: ${NEUROMAP_PASSWORD:?Set a unique NEUROMAP_PASSWORD}
      NEUROMAP_ORIGINS: '["http://localhost:8080"]'
    volumes:
      - research-data:/app/data
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/ready')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped
  web:
    build: ./frontend
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      api:
        condition: service_healthy
    mem_limit: 256m
    restart: unless-stopped
volumes:
  research-data:
